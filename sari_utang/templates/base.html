<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sari Utang{% endblock %}</title>
  <!-- App icon: browser tab, and the icon when added to a phone's home screen.
       ?v= makes browsers fetch a changed icon (they cache favicons for a long time). -->
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg', v=5) }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='favicon-32.png', v=5) }}" type="image/png" sizes="32x32">
  <link rel="alternate icon" href="{{ url_for('static', filename='icon.ico', v=5) }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png', v=5) }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0d6efd">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  {% block content %}{% endblock %}

  <footer class="container py-3 mt-auto text-center small text-body-secondary d-print-none">
    <button type="button" class="btn btn-link btn-sm text-body-secondary p-0 bi bi-circle-half" data-theme-toggle
            aria-label="Change theme">Theme</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
