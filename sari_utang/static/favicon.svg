<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sari Utang">
  <!-- Black on a light browser, white on a dark one. The peso sign and the lines use the tab's
       own colour, so they look cut out of the notebook. -->
  <style>
    .ink { fill: #111827; stroke: #111827; }
    .cut { fill: none; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ffffff; stroke: #ffffff; }
      .cut { stroke: #111827; }
    }
  </style>
  <g class="ink" stroke-width="0">
    <rect x="21" y="18.5" width="58" height="64.5" rx="6"/>
    <rect x="27.8" y="13.1" width="4.3" height="11.3" rx="2.1"/>
    <rect x="38.6" y="13.1" width="4.3" height="11.3" rx="2.1"/>
    <rect x="49.3" y="13.1" width="4.3" height="11.3" rx="2.1"/>
    <rect x="60" y="13.1" width="4.3" height="11.3" rx="2.1"/>
    <rect x="70.8" y="13.1" width="4.3" height="11.3" rx="2.1"/>
  </g>
  <g class="cut">
    <path d="M45 30H54A7 7 0 0 1 54 44H45M42.5 27V52" stroke-width="5.5"/>
    <path d="M36 34.8H64M36 39.2H64" stroke-width="2.2"/>
    <path d="M28 62.5H72M28 69.4H72M28 76.2H72" stroke-width="1.7" stroke-linecap="round"/>
  </g>
</svg>
