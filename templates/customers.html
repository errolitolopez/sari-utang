{% extends "base.html" %}

{% block title %}Customers · Sari Utang{% endblock %}

{% block content %}
{% include "_navbar.html" %}

<main class="container py-3">
  <div id="customers-error" class="alert alert-danger d-none" role="alert"></div>

  <div class="d-flex gap-2 mb-3">
    <input id="search" type="search" class="form-control" placeholder="Search name or phone"
           aria-label="Search customers" autocomplete="off">
    <button class="btn btn-primary text-nowrap" data-bs-toggle="modal" data-bs-target="#add-customer-modal">
      + Add
    </button>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between">
      <span class="fw-semibold">Customers</span>
      <span id="customer-summary" class="text-body-secondary small"></span>
    </div>
    <div id="customer-list" class="list-group list-group-flush">
      <div class="list-group-item text-body-secondary">Loading...</div>
    </div>
  </div>

  <!-- Page controls (hidden when everything fits on one page) -->
  <nav id="pager" class="d-flex justify-content-between align-items-center mt-3 d-none" aria-label="Customer pages">
    <button id="prev-page" type="button" class="btn btn-outline-primary btn-sm">‹ Prev</button>
    <span id="page-info" class="small text-body-secondary"></span>
    <button id="next-page" type="button" class="btn btn-outline-primary btn-sm">Next ›</button>
  </nav>
</main>

<!-- Add customer form (opens as a popup) -->
<div class="modal fade" id="add-customer-modal" tabindex="-1" aria-labelledby="add-customer-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="add-customer-form" class="modal-content" novalidate>
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="add-customer-title">Add customer</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="customer-name" class="form-label">Name</label>
          <input id="customer-name" class="form-control" maxlength="100" autocomplete="off" required>
        </div>
        <div class="mb-3">
          <label for="customer-phone" class="form-label">Phone <span class="text-body-secondary">(optional)</span></label>
          <input id="customer-phone" type="tel" class="form-control" maxlength="20" placeholder="0917 123 4567">
        </div>
        <div id="add-customer-error" class="alert alert-danger py-2 mb-0 d-none" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="add-customer-button" type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/customers.js') }}"></script>
{% endblock %}
