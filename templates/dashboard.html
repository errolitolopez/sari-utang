{% extends "base.html" %}

{% block title %}Dashboard · Sari Utang{% endblock %}

{% block content %}
{% include "_navbar.html" %}

<main class="container py-3">
  <div id="dashboard-error" class="alert alert-danger d-none" role="alert"></div>

  <!-- Summary numbers -->
  <div class="row g-2 mb-3">
    <div class="col-12">
      <div class="card text-bg-danger">
        <div class="card-body">
          <div class="small">Total utang</div>
          <div id="total-outstanding" class="fs-2 fw-bold">—</div>
        </div>
      </div>
    </div>
    <div class="col-6">
      <div class="card">
        <div class="card-body">
          <div class="small text-body-secondary">May utang</div>
          <div id="customers-with-utang" class="fs-4 fw-semibold">—</div>
        </div>
      </div>
    </div>
    <div class="col-6">
      <div class="card">
        <div class="card-body">
          <div class="small text-body-secondary">Customers</div>
          <div id="customer-count" class="fs-4 fw-semibold">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Utang that has waited too long; links to the Singilin list -->
  <a href="{{ url_for('singilin_page') }}" id="overdue-card"
     class="card text-decoration-none mb-3 border-warning">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <div class="small text-body-secondary">Matagal na utang (<span id="overdue-days">30</span>+ araw)</div>
        <div id="overdue-count" class="fs-4 fw-semibold">—</div>
      </div>
      <span class="text-body-secondary fs-4">›</span>
    </div>
  </a>

  <!-- Who owes the most -->
  <div class="card mb-3">
    <div class="card-header fw-semibold">Pinakamalaking utang</div>
    <div id="top-balances" class="list-group list-group-flush"></div>
  </div>

  <!-- Latest utang and payments -->
  <div class="card">
    <div class="card-header fw-semibold">Recent transactions</div>
    <div id="recent-transactions" class="list-group list-group-flush"></div>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
